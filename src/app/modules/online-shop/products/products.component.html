<div class="products-page">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body" style="padding: 0%;">
          <div class="tabs">
            <ul class="tabs__links">
              <li>
                <button
                  type="button"
                  class="tabs__link"
                  [ngClass]="activeTab === 0 ? 'active' : ''"
                  (click)="changeTab(0)"
                >
                  <span class="tabs__link__text" data-text="0">
                    <img class="tabs__link-icon" src="assets/images/tabs/products.png" alt="" />
                    <span>{{ 'Products' | translate }}</span>
                  </span>
                </button>
              </li>
              <li>
                <button
                  type="button"
                  class="tabs__link"
                  [ngClass]="activeTab === 1 ? 'active' : ''"
                  (click)="changeTab(1)"
                >
                  <span class="tabs__link__text" data-text="1">
                    <img class="tabs__link-icon" src="assets/images/tabs/categories.png" alt="" />
                    <span>{{ 'Product Categories' | translate }}</span>
                  </span>
                </button>
              </li>
              <li>
                <button
                  type="button"
                  class="tabs__link"
                  [ngClass]="activeTab === 2 ? 'active' : ''"
                  (click)="changeTab(2)"
                >
                  <span class="tabs__link__text" data-text="2">
                    <img class="tabs__link-icon" src="assets/images/tabs/brands.png" alt="" />
                    <span>{{ 'Brands' | translate }}</span>
                  </span>
                </button>
              </li>
            </ul>

            <ul class="tabs__contents">
              <li>
                <div class="tabs__content active">
                  <ng-container *ngIf="activeTab === 0">
                  <div class="separator-breadcrumb border-top products-tab-separator"></div>

                  <div [dir]="globalDataService.getdir()" class="gridAboveHeightInSaleOrderHistory">
                    <div *ngIf="loadError" class="alert alert-warning mb-2" role="alert">
                      {{ loadError }}
                    </div>

                    <div class="os-filter-toolbar">
                      <div class="os-filter-toolbar__field os-filter-toolbar__field--search">
                        <label class="os-filter-toolbar__label" for="productSearch">
                          {{ 'Search' | translate }}
                        </label>
                        <input
                          id="productSearch"
                          [formControl]="searchControl"
                          class="form-control form-control-rounded"
                          type="text"
                          [placeholder]="'Search products' | translate"
                        />
                      </div>
                    </div>

                    <div class="row">
                      <div class="col-md-12">
                        <div class="card mb-3">
                          <ngx-datatable
                            [ngStyle]="{ height: gridHeight, 'box-shadow': 'none' }"
                            class="material fullscreen products-datatable"
                            [columnMode]="ColumnMode.force"
                            [headerHeight]="48"
                            [footerHeight]="30"
                            [rowHeight]="56"
                            [rows]="filteredData"
                            [scrollbarH]="true"
                            [loadingIndicator]="loadingIndicator"
                            [externalPaging]="true"
                            [count]="page.totalElements"
                            [offset]="page.pageNumber"
                            [limit]="page.size"
                            (page)="setPage($event)"
                          >
                            <ngx-datatable-column
                              [name]="'Images' | translate"
                              [sortable]="false"
                              [canAutoResize]="false"
                              [width]="108"
                              [minWidth]="108"
                              cellClass="products-datatable__image-col"
                              headerClass="products-datatable__image-col"
                            >
                              <ng-template ngx-datatable-cell-template let-row="row">
                                <div class="products-datatable__image-cell">
                                  <button
                                    type="button"
                                    class="products-datatable__thumb-btn"
                                    (click)="openImagesModal(row)"
                                    [title]="'Manage images' | translate"
                                  >
                                    <span class="products-datatable__thumb-frame">
                                      <img
                                        class="products-datatable__thumb"
                                        [src]="row.pictureUrl || 'assets/images/logo.svg'"
                                        [alt]="row.productName"
                                        (error)="onImageError($event)"
                                      />
                                    </span>
                                    <span class="products-datatable__thumb-badge">
                                      {{ getImageCount(row) > 0 ? getImageCount(row) : '+' }}
                                    </span>
                                  </button>
                                </div>
                              </ng-template>
                            </ngx-datatable-column>

                            <ngx-datatable-column
                              [name]="'Product Name' | translate"
                              prop="productName"
                              [minWidth]="260"
                              [flexGrow]="3"
                              cellClass="products-datatable__text-col"
                              headerClass="products-datatable__text-col"
                            >
                              <ng-template ngx-datatable-cell-template let-row="row">
                                <div class="products-datatable__text-cell" [title]="getProductNameTitle(row)">
                                  <span class="products-datatable__text-primary">{{ getDisplayLabel(row) }}</span>
                                  <span *ngIf="row.displayName" class="products-datatable__text-secondary">
                                    {{ row.productName }}
                                  </span>
                                </div>
                              </ng-template>
                            </ngx-datatable-column>

                            <ngx-datatable-column
                              [name]="'Category' | translate"
                              prop="categoryName"
                              [minWidth]="200"
                              [flexGrow]="2"
                              cellClass="products-datatable__text-col"
                              headerClass="products-datatable__text-col"
                            >
                              <ng-template ngx-datatable-cell-template let-row="row">
                                <div class="products-datatable__text-cell" [title]="row.categoryName">
                                  <span class="products-datatable__text-primary">{{ row.categoryName }}</span>
                                </div>
                              </ng-template>
                            </ngx-datatable-column>

                            <ngx-datatable-column
                              [name]="'Brand' | translate"
                              prop="brandName"
                              [minWidth]="120"
                              [flexGrow]="1"
                              cellClass="products-datatable__text-col"
                              headerClass="products-datatable__text-col"
                            >
                              <ng-template ngx-datatable-cell-template let-row="row">
                                <div class="products-datatable__text-cell" [title]="row.brandName">
                                  <span class="products-datatable__text-primary">{{ row.brandName }}</span>
                                </div>
                              </ng-template>
                            </ngx-datatable-column>

                            <ngx-datatable-column
                              [name]="'Slug' | translate"
                              prop="slug"
                              [minWidth]="160"
                            >
                              <ng-template ngx-datatable-cell-template let-row="row">
                                <div class="products-datatable__cell-actions">
                                  <input
                                    type="text"
                                    class="form-control form-control-sm products-datatable__edit-input"
                                    [value]="row.slug"
                                    [placeholder]="slugPlaceholder(row)"
                                    [disabled]="isSaving(row, 'slug')"
                                    (blur)="onSlugBlur(row, $event)"
                                    (keydown.enter)="$any($event.target).blur()"
                                  />
                                </div>
                              </ng-template>
                            </ngx-datatable-column>

                            <ngx-datatable-column
                              [name]="'Available Qty' | translate"
                              prop="availableQuantity"
                              [minWidth]="110"
                            >
                              <ng-template ngx-datatable-cell-template let-row="row">
                                <span
                                  [class.text-danger]="row.availableQuantity <= 0"
                                  [class.text-success]="row.availableQuantity > 0"
                                >
                                  {{ row.availableQuantity }}
                                </span>
                              </ng-template>
                            </ngx-datatable-column>

                            <ngx-datatable-column
                              [name]="'Sell Price' | translate"
                              prop="actualSellPrice"
                              [minWidth]="120"
                              cellClass="products-datatable__center-col"
                              headerClass="products-datatable__center-col"
                            >
                              <ng-template ngx-datatable-cell-template let-row="row">
                                <div class="products-datatable__cell-center products-datatable__cell-actions">
                                  <input
                                    type="number"
                                    class="form-control form-control-sm products-datatable__edit-input"
                                    [value]="row.actualSellPrice"
                                    min="0"
                                    step="0.01"
                                    [disabled]="isSaving(row, 'price')"
                                    (blur)="onSellPriceBlur(row, $event)"
                                    (keydown.enter)="$any($event.target).blur()"
                                  />
                                </div>
                              </ng-template>
                            </ngx-datatable-column>

                            <ngx-datatable-column
                              [name]="'Weight (g)' | translate"
                              prop="productWeightKg"
                              [minWidth]="110"
                              cellClass="products-datatable__center-col"
                              headerClass="products-datatable__center-col"
                            >
                              <ng-template ngx-datatable-cell-template let-row="row">
                                <div class="products-datatable__cell-center products-datatable__cell-actions">
                                  <input
                                    type="number"
                                    class="form-control form-control-sm products-datatable__edit-input"
                                    [value]="weightGrams(row)"
                                    [title]="weightGrams(row) > 0
                                      ? ''
                                      : ('No weight set — delivery is quoted at the courier minimum.' | translate)"
                                    min="0"
                                    step="1"
                                    placeholder="0"
                                    [disabled]="isSaving(row, 'weight')"
                                    (blur)="onWeightBlur(row, $event)"
                                    (keydown.enter)="$any($event.target).blur()"
                                  />
                                </div>
                              </ng-template>
                            </ngx-datatable-column>

                            <ngx-datatable-column
                              [name]="'Discount (%)' | translate"
                              prop="discountPercent"
                              [minWidth]="110"
                              cellClass="products-datatable__center-col"
                              headerClass="products-datatable__center-col"
                            >
                              <ng-template ngx-datatable-cell-template let-row="row">
                                <div class="products-datatable__cell-center products-datatable__cell-actions">
                                  <input
                                    type="number"
                                    class="form-control form-control-sm products-datatable__edit-input"
                                    [value]="row.discountPercent"
                                    min="0"
                                    max="100"
                                    step="0.01"
                                    [disabled]="isSaving(row, 'discount')"
                                    (blur)="onDiscountBlur(row, $event)"
                                    (keydown.enter)="$any($event.target).blur()"
                                  />
                                </div>
                              </ng-template>
                            </ngx-datatable-column>

                            <ngx-datatable-column
                              [name]="'Show Online' | translate"
                              [sortable]="false"
                              [minWidth]="110"
                              cellClass="products-datatable__center-col"
                              headerClass="products-datatable__center-col"
                            >
                              <ng-template ngx-datatable-cell-template let-row="row">
                                <div class="products-datatable__cell-center products-datatable__cell-actions">
                                  <label
                                    class="status-switch mb-0"
                                    [class.status-switch--disabled]="isSaving(row, 'showOnline')"
                                    [title]="row.showProductOnline ? ('Enabled' | translate) : ('Disabled' | translate)"
                                  >
                                    <input
                                      type="checkbox"
                                      [checked]="row.showProductOnline"
                                      [disabled]="isSaving(row, 'showOnline')"
                                      (change)="onShowOnlineToggle(row, $event)"
                                    />
                                    <span class="status-switch__slider"></span>
                                  </label>
                                </div>
                              </ng-template>
                            </ngx-datatable-column>

                            <ngx-datatable-column
                              [name]="'Available' | translate"
                              [sortable]="false"
                              [minWidth]="100"
                              cellClass="products-datatable__center-col"
                              headerClass="products-datatable__center-col"
                            >
                              <ng-template ngx-datatable-cell-template let-row="row">
                                <div class="products-datatable__cell-center products-datatable__cell-actions">
                                  <label
                                    class="status-switch mb-0"
                                    [class.status-switch--disabled]="isSaving(row, 'available')"
                                    [title]="row.isAvailable ? ('Enabled' | translate) : ('Disabled' | translate)"
                                  >
                                    <input
                                      type="checkbox"
                                      [checked]="row.isAvailable"
                                      [disabled]="isSaving(row, 'available')"
                                      (change)="onAvailableToggle(row, $event)"
                                    />
                                    <span class="status-switch__slider"></span>
                                  </label>
                                </div>
                              </ng-template>
                            </ngx-datatable-column>

                            <ngx-datatable-column
                              [name]="'Actions' | translate"
                              [sortable]="false"
                              [minWidth]="110"
                              cellClass="products-datatable__center-col"
                              headerClass="products-datatable__center-col"
                            >
                              <ng-template ngx-datatable-cell-template let-row="row">
                                <div class="products-datatable__cell-center products-datatable__cell-actions">
                                  <button
                                    type="button"
                                    class="btn btn-sm btn-primary"
                                    (click)="openEditModal(row)"
                                  >
                                    <i class="fa fa-pencil fontAwesome_Li_Class"></i>
                                    {{ 'Edit' | translate }}
                                  </button>
                                </div>
                              </ng-template>
                            </ngx-datatable-column>
                          </ngx-datatable>
                        </div>
                      </div>
                    </div>
                  </div>
                  </ng-container>

                  <app-product-categories *ngIf="activeTab === 1"></app-product-categories>
                  <app-product-brands *ngIf="activeTab === 2"></app-product-brands>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
