<div
  class="separator-breadcrumb border-top products-tab-separator"
></div>

<div [dir]="globalDataService.getdir()" class="gridAboveHeightInSaleOrderHistory">
  <div *ngIf="loadError" class="alert alert-warning mb-2" role="alert">
    {{ loadError }}
  </div>

  <div class="os-filter-toolbar">
    <div class="os-filter-toolbar__field os-filter-toolbar__field--search">
      <label class="os-filter-toolbar__label" for="brandSearch">{{ 'Search' | translate }}</label>
      <input
        id="brandSearch"
        [formControl]="searchControl"
        class="form-control form-control-rounded"
        type="text"
        [placeholder]="'Search brands' | translate"
      />
    </div>
  </div>

  <div class="row">
    <div class="col-md-12">
      <div class="card mb-3">
        <ngx-datatable
          [ngStyle]="{ height: gridHeight, 'box-shadow': 'none' }"
          class="material products-datatable"
          [columnMode]="ColumnMode.force"
          [headerHeight]="48"
          [footerHeight]="30"
          [rowHeight]="56"
          [rows]="data"
          [scrollbarH]="true"
          [loadingIndicator]="loadingIndicator"
          [externalPaging]="true"
          [count]="page.totalElements"
          [offset]="page.pageNumber"
          [limit]="page.size"
          (page)="setPage($event)"
        >
          <ngx-datatable-column
            [name]="'Image' | translate"
            [sortable]="false"
            [canAutoResize]="false"
            [width]="108"
            [minWidth]="108"
            cellClass="products-datatable__image-col"
            headerClass="products-datatable__image-col"
          >
            <ng-template ngx-datatable-cell-template let-row="row">
              <div class="products-datatable__image-cell">
                <button
                  type="button"
                  class="products-datatable__thumb-btn"
                  (click)="openImageModal(row)"
                  [title]="'Manage image' | translate"
                >
                  <span class="products-datatable__thumb-frame">
                    <img
                      class="products-datatable__thumb"
                      [src]="row.pictureUrl || 'assets/images/logo.svg'"
                      [alt]="row.name"
                      (error)="onImageError($event)"
                    />
                  </span>
                  <span class="products-datatable__thumb-badge">
                    {{ row.pictureUrl ? '1' : '+' }}
                  </span>
                </button>
              </div>
            </ng-template>
          </ngx-datatable-column>

          <ngx-datatable-column [name]="'Name' | translate" prop="name" [minWidth]="220">
            <ng-template ngx-datatable-cell-template let-row="row">
              <strong>{{ row.name }}</strong>
            </ng-template>
          </ngx-datatable-column>

          <ngx-datatable-column
            [name]="'Popular' | translate"
            [sortable]="false"
            [minWidth]="110"
            cellClass="products-datatable__center-col"
            headerClass="products-datatable__center-col"
          >
            <ng-template ngx-datatable-cell-template let-row="row">
              <div class="products-datatable__cell-center products-datatable__cell-actions">
                <label
                  class="status-switch mb-0"
                  [class.status-switch--disabled]="isSaving(row)"
                  [title]="row.isPopular ? ('Enabled' | translate) : ('Disabled' | translate)"
                >
                  <input
                    type="checkbox"
                    [checked]="row.isPopular"
                    [disabled]="isSaving(row)"
                    (change)="onPopularToggle(row, $event)"
                  />
                  <span class="status-switch__slider"></span>
                </label>
              </div>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
      </div>
    </div>
  </div>
</div>
