<div class="modal-header">
  <h5 class="modal-title">{{ 'Manage Product' | translate }}</h5>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="modal-body" *ngIf="product">
  <div class="mb-3">
    <label class="font-weight-bold d-block">{{ 'Product Name' | translate }}</label>
    <div>{{ product.productName }}</div>
  </div>

  <div class="form-group">
    <label for="productDisplayName">{{ 'Display Name' | translate }}</label>
    <input
      id="productDisplayName"
      type="text"
      class="form-control"
      [(ngModel)]="displayName"
      [placeholder]="product.productName"
      maxlength="512"
    />
    <small class="form-text text-muted">
      {{ 'Leave empty to use the POS product name on the storefront.' | translate }}
    </small>
  </div>

  <div class="form-group product-description-field mb-0">
    <label>{{ 'Description' | translate }}</label>
    <p-editor [(ngModel)]="description" [style]="{ height: '280px' }">
      <p-header>
        <span class="ql-formats">
          <select class="ql-header">
            <option value="2"></option>
            <option value="3"></option>
            <option selected></option>
          </select>
        </span>
        <span class="ql-formats">
          <button type="button" class="ql-bold"></button>
          <button type="button" class="ql-italic"></button>
          <button type="button" class="ql-underline"></button>
        </span>
        <span class="ql-formats">
          <button type="button" class="ql-list" value="ordered"></button>
          <button type="button" class="ql-list" value="bullet"></button>
        </span>
        <span class="ql-formats">
          <button type="button" class="ql-clean"></button>
        </span>
      </p-header>
    </p-editor>
    <small class="form-text text-muted">
      {{ 'Use headings, bold text and lists. Leave empty to use the POS product description on the storefront.' | translate }}
    </small>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">
    <i class="i-Close-Window"></i>
    {{ 'Cancel' | translate }}
  </button>
  <button type="button" class="btn btn-primary" [disabled]="saving" (click)="save()">
    <span *ngIf="saving" class="spinner-border spinner-border-sm" role="status"></span>
    <i *ngIf="!saving" class="i-Yes"></i>
    {{ 'Save' | translate }}
  </button>
</div>
