<div class="mailbox-modal">
  <div class="modal-header">
    <h4 class="modal-title">{{ title }}</h4>
    <button type="button" class="close" aria-label="Close" (click)="close()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="modal-body">
      <p class="mailbox-modal__intro">
        Use the exact address Resend receives mail for, for example support@yourdomain.com.
      </p>

      <div class="form-group">
        <label>Email address <span class="text-danger">*</span></label>
        <input
          type="email"
          class="form-control"
          formControlName="emailAddress"
          placeholder="support@yourdomain.com"
        />
        <div class="text-danger small" *ngIf="submitted && f.emailAddress.invalid">
          Enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <label>Display name <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          formControlName="displayName"
          placeholder="Sasta Khareedo Support"
        />
        <div class="text-danger small" *ngIf="submitted && f.displayName.invalid">
          Display name is required.
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 form-group">
          <label>Mailbox type <span class="text-danger">*</span></label>
          <select class="form-control" formControlName="mailboxType">
            <option *ngFor="let type of mailboxTypes" [value]="type.id">{{ type.name }}</option>
          </select>
        </div>
      </div>

      <div class="form-row switches-row">
        <label class="switch-label">
          <input type="checkbox" formControlName="isActive" />
          <span>Active</span>
        </label>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-outline-secondary" (click)="close()">
        Cancel
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        <i class="fa fa-save fontAwesome_Li_Class mr-1" *ngIf="!saving"></i>
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</div>
